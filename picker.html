<script>

const API_KEY="AIzaSyC5C7fYY21jX9Hkb5CARB3x9SM2dxiEY0A";

const PACKAGE="uz.devior.qarzdaftar";

// Translations (same as before)
const T={

ru:{t:"Подключить общий журнал",d:"Ваш партнёр поделился с вами журналом. Нажмите кнопку ниже, чтобы подключить его в QarzDaftar.",b:"Подключиться и продолжить"},

de:{t:"Gemeinsames Konto verbinden",d:"Ihr Partner hat ein Konto mit Ihnen geteilt. Tippen Sie unten, um es in QarzDaftar zu verknüpfen.",b:"Verbinden und fortfahren"},

function detectLang(){
  var p=new URLSearchParams(window.location.search);
  var l=(p.get("lang")||"").toLowerCase();
  if(T[l])return l;
  var b=(navigator.language||navigator.languages?.[0]||"en").slice(0,2);
  if(T[b])return b;
  return "en";
}

var lang=detectLang(),tr=T[lang];
document.getElementById("page-title").textContent=tr.t;
document.getElementById("t-title").textContent=tr.t;
document.getElementById("t-desc").textContent=tr.d;
document.getElementById("t-btn").textContent=tr.b;

// Read inviteCode from URL (e.g. ?inviteCode=ABC12345&lang=en)
var params=new URLSearchParams(window.location.search);
var inviteCode=params.get("inviteCode");

if(!inviteCode){
  document.getElementById("status").textContent="Error: no invite code in link.";
}

var tokenClient,accessToken=null;

function initTokenClient(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:"https://www.googleapis.com/auth/drive.file",
    callback:function(r){
      if(r.error){
        document.getElementById("status").textContent="Sign-in failed.";
        return;
      }
      accessToken=r.access_token;
      loadPicker();
    }
  });
}

function startPicker(){
  if(!inviteCode){
    document.getElementById("status").textContent="Error: no invite code in link.";
    return;
  }
  document.getElementById("status").textContent="Loading...";
  gapi.load("picker",function(){
    initTokenClient();
    tokenClient.requestAccessToken({prompt:"consent"});
  });
}

function loadPicker(){
  if(!inviteCode){
    document.getElementById("status").textContent="Error: no invite code in link.";
    return;
  }

  // Build query to find the shared folder by name.
  var query = "title contains 'QarzDaftar_Shared_"+inviteCode+"' and mimeType='application/vnd.google-apps.folder'";

  var view=new google.picker.DocsView(google.picker.ViewId.FOLDERS)
    .setMimeTypes("application/vnd.google-apps.folder")
    .setQuery(query)
    .setSelectFolderEnabled(true);

  var picker=new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(accessToken)
    .setDeveloperKey(API_KEY)
    .setAppId(APP_ID)
    .setCallback(pickerCallback)
    .build();

  picker.setVisible(true);
  document.getElementById("status").textContent="";
}

function pickerCallback(data){
  if(!data || !data[google.picker.Response.ACTION]){
    // Picker closed without action or error.
    document.getElementById("status").textContent="Cancelled. Close this tab and try again.";
    return;
  }

  var action=data[google.picker.Response.ACTION];

  if(action===google.picker.Action.PICKED){
    var docs=data[google.picker.Response.DOCUMENTS];
    if(!docs || docs.length===0){
      document.getElementById("status").textContent="No folder selected.";
      return;
    }
    var id=docs[0].id;

    // Redirect back to app with the chosen folderId.
    var url="intent://picker?folderId="+encodeURIComponent(id)
            +"#Intent;scheme=qarz;package="+PACKAGE+";end";

    document.getElementById("status").textContent="Connecting...";
    window.location.href=url;
  } else if(action===google.picker.Action.CANCEL){
    document.getElementById("status").textContent="Cancelled. Close this tab and try again.";
  } else {
    // Unknown action (e.g., error from Google).
    document.getElementById("status").textContent="Picker failed or closed unexpectedly. Try again.";
  }
}
</script>
